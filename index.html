<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Societe Cafe — Artisanal coffee and refined experiences.">
  <title>Societe Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0c0a08;
      --text-gold-light: #f5eedf;
      --text-gold: #dfa868;
      --accent-glow: rgba(223, 168, 104, 0.15);
      --border-subtle: rgba(223, 168, 104, 0.2);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(ellipse 60% 50% at 50% 50%, var(--accent-glow) 0%, transparent 70%),
        radial-gradient(circle at 20% 20%, rgba(204, 106, 82, 0.08) 0%, transparent 40%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-gold-light);
      overflow: hidden;
      padding: 2rem;
      user-select: none;
    }

    .cafe-container {
      text-align: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cafe-title {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 15%, #dfa868 60%, #cc6a52 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 45px rgba(223, 168, 104, 0.25);
      transition: letter-spacing 0.5s ease, transform 0.5s ease;
      cursor: default;
    }

    .cafe-title:hover {
      letter-spacing: 0.26em;
      transform: scale(1.02);
    }

    .subtle-line {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-gold), transparent);
      margin: 1.5rem auto 0 auto;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="cafe-container">
    <h1 class="cafe-title">Societe Cafe</h1>
    <div class="subtle-line"></div>
  </main>
</body>
</html>
